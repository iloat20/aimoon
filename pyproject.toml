[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimoon"
version = "0.2.2"
description = "A股量化筛选与交易建议系统 — ML集成排名 + Alpha Zoo 452因子 + 统一回测评分 + 交易策略引擎"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "iloat" },
]
dependencies = [
    "akshare>=1.14",
    "mootdx>=0.9",
    "pandas>=2.0",
    "numpy>=1.26",
    "tabulate>=0.9",
    "colorama>=0.4",
    "rich>=13.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]

[project.scripts]
aimoon = "aimoon.cli:main"

[project.urls]
Homepage = "https://github.com/iloat20/aimoon"
Repository = "https://github.com/iloat20/aimoon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
