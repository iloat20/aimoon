[project]
name = "aimoon"
version = "0.3.3"
description = "AI-powered A-share stock analysis with multi-platform data collection"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "aimoon", email = "aimoon@users.noreply.github.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "jinja2>=3.1.4",
    "akshare>=1.16.0",
    "pysnowball>=0.1.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "playwright>=1.60.0",
    "markdown>=3.10.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/aimoon/aimoon"
Repository = "https://github.com/aimoon/aimoon"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
selenium = ["selenium>=4.45.0"]  # 东方财富股吧增强采集
all = ["selenium", "playwright"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aimoon = "aimoon.main:main"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pylint>=4.0.6",
]
