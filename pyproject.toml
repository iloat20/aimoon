[project]
name = "aimoon"
version = "0.6.0"
description = "AI-powered A-share stock analysis with multi-platform data collection"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "aimoon", email = "aimoon@users.noreply.github.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "jinja2>=3.1.4",
    "akshare>=1.16.0",
    "pdfplumber>=0.11.0",
    "playwright>=1.60.0",
    "markdown>=3.10.2",
    "bleach>=6.1.0",
]

[project.urls]
Homepage = "https://github.com/aimoon/aimoon"
Repository = "https://github.com/aimoon/aimoon"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "black>=26.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimoon = ["**/*.html", "**/*.css", "**/*.js", "**/*.md", "**/*.txt"]

[project.scripts]
aimoon = "aimoon.adapters.driving.cli.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/aimoon/adapters/driving/cli/main.py" = ["E402"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pylint.main]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "C0114",              # missing-module-docstring
    "C0115",              # missing-class-docstring
    "C0116",              # missing-function-docstring
    "C0301",              # line-too-long (handled by black)
    "C0415",              # import-outside-toplevel (intentional lazy imports)
    "R0801",              # duplicate-code (false positives in __init__.py re-exports)
    "R0902",              # too-many-instance-attributes
    "R0903",              # too-few-public-methods
    "R0912",              # too-many-branches
    "R0913",              # too-many-arguments
    "R0914",              # too-many-locals
    "R0915",              # too-many-statements
    "R0917",              # too-many-positional-arguments
    "W0212",              # protected-access (base class accessing subclass internals)
    "W0613",              # unused-argument (port interface compliance)
    "W0718",              # broad-exception-caught (intentional: collectors never fail pipeline)
    "R0916",              # too-many-boolean-expressions (validation logic)
    "C0103",              # invalid-name (private module-level vars like _settings, _pw_*)
    "W0603",              # global-statement (singleton pattern)
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-tmp"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::UserWarning:py_mini_racer"]
markers = ["integration: network-dependent integration tests (akshare, live pipeline)"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pylint>=4.0.6",
]
